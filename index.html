<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Will They Block You?</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    color: white;
    background: linear-gradient(135deg, #120018, #28002f, #09000d);
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.container {
    width: 100%;
    max-width: 500px;
    text-align: center;
}

h1 {
    font-size: 32px;
    margin-bottom: 10px;
}

h1 span {
    color: #ff247f;
}

.subtitle {
    color: #ddd;
    line-height: 1.5;
    margin-bottom: 25px;
}

.card {
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.18);
    border-radius: 18px;
    padding: 22px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.35);
}

input {
    width: 100%;
    padding: 13px;
    border: none;
    border-radius: 10px;
    font-size: 16px;
    text-align: center;
    margin-bottom: 18px;
    outline: none;
}

button {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 10px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    background: linear-gradient(90deg, #ff176f, #9c20b5);
    color: white;
    transition: 0.2s;
}

button:hover {
    transform: scale(1.02);
}

button:active {
    transform: scale(0.98);
}

.option {
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.2);
    margin: 10px 0;
    padding: 14px;
    border-radius: 10px;
    cursor: pointer;
    text-align: left;
}

.option:hover {
    background: rgba(255,255,255,0.18);
}

.question-number {
    color: #ff5c9d;
    font-weight: bold;
    margin-bottom: 10px;
}

.question {
    font-size: 21px;
    margin-bottom: 20px;
}

.result {
    font-size: 42px;
    font-weight: bold;
    color: #ff3d91;
    margin: 20px 0;
}

.message {
    font-size: 18px;
    line-height: 1.5;
    color: #eee;
}

.hidden {
    display: none;
}

.small {
    color: #aaa;
    font-size: 13px;
    margin-top: 18px;
}
</style>
</head>

<body>

<div class="container">

    <!-- HOME -->
    <div id="home" class="card">

        <h1>
            Will They <span>Block</span> You? 🚫
        </h1>

        <div class="subtitle">
            Answer these 10 questions and discover your result 👀<br>
            Let's see what happens 👇
        </div>

        <input
            type="text"
            id="name"
            placeholder="Enter your name"
            maxlength="30"
        >

        <button type="button" onclick="startQuiz()">
            🚀 Start Quiz
        </button>

        <div class="small">
            Just for fun 😄
        </div>

    </div>


    <!-- QUIZ -->
    <div id="quiz" class="card hidden">

        <div class="question-number" id="questionNumber">
            Question 1 of 10
        </div>

        <div class="question" id="questionText"></div>

        <div id="options"></div>

    </div>


    <!-- RESULT -->
    <div id="result" class="card hidden">

        <h1>
            Your Result 🎯
        </h1>

        <div id="resultPercent" class="result">
            0%
        </div>

        <div id="resultMessage" class="message"></div>

        <br>

        <button type="button" onclick="restartQuiz()">
            🔄 Try Again
        </button>

        <br><br>

        <button type="button" onclick="shareResult()">
            📤 Share Result
        </button>

    </div>

</div>


<script>

const questions = [

    {
        question: "Do you reply late to their messages?",
        options: [
            { text: "Always 😭", score: 10 },
            { text: "Sometimes", score: 5 },
            { text: "Never ❤️", score: 0 }
        ]
    },

    {
        question: "Do you leave them on seen?",
        options: [
            { text: "Yes 😎", score: 10 },
            { text: "Sometimes", score: 5 },
            { text: "Never", score: 0 }
        ]
    },

    {
        question: "Do you cancel plans at the last minute?",
        options: [
            { text: "All the time 😂", score: 10 },
            { text: "Sometimes", score: 5 },
            { text: "Never", score: 0 }
        ]
    },

    {
        question: "Do you talk to their rivals?",
        options: [
            { text: "Of course 😏", score: 10 },
            { text: "Maybe", score: 5 },
            { text: "Never", score: 0 }
        ]
    },

    {
        question: "Do you forget important dates?",
        options: [
            { text: "Yes 😭", score: 10 },
            { text: "Sometimes", score: 5 },
            { text: "Never", score: 0 }
        ]
    },

    {
        question: "Do you make them jealous on purpose?",
        options: [
            { text: "Definitely 😈", score: 10 },
            { text: "Sometimes", score: 5 },
            { text: "Never", score: 0 }
        ]
    },

    {
        question: "Do you disappear without explaining?",
        options: [
            { text: "Yes 👻", score: 10 },
            { text: "Sometimes", score: 5 },
            { text: "Never", score: 0 }
        ]
    },

    {
        question: "Do you tease them too much?",
        options: [
            { text: "Always 😂", score: 10 },
            { text: "Sometimes", score: 5 },
            { text: "Never", score: 0 }
        ]
    },

    {
        question: "Do you ignore their calls?",
        options: [
            { text: "Often 📵", score: 10 },
            { text: "Sometimes", score: 5 },
            { text: "Never", score: 0 }
        ]
    },

    {
        question: "Would you choose your friends over them?",
        options: [
            { text: "Yes 😎", score: 10 },
            { text: "Depends", score: 5 },
            { text: "Never ❤️", score: 0 }
        ]
    }

];

let currentQuestion = 0;
let totalScore = 0;
let userName = "";


/* START QUIZ */

function startQuiz() {

    const nameInput = document.getElementById("name");

    userName = nameInput.value.trim();

    if (userName === "") {
        alert("Please enter your name first 😊");
        nameInput.focus();
        return;
    }

    currentQuestion = 0;
    totalScore = 0;

    document.getElementById("home").classList.add("hidden");
    document.getElementById("result").classList.add("hidden");
    document.getElementById("quiz").classList.remove("hidden");

    showQuestion();
}


/* SHOW QUESTION */

function showQuestion() {

    const question = questions[currentQuestion];

    document.getElementById("questionNumber").textContent =
        "Question " + (currentQuestion + 1) + " of " + questions.length;

    document.getElementById("questionText").textContent =
        question.question;

    const optionsDiv = document.getElementById("options");

    optionsDiv.innerHTML = "";

    question.options.forEach(function(option) {

        const button = document.createElement("div");

        button.className = "option";

        button.textContent = option.text;

        button.onclick = function() {
            selectAnswer(option.score);
        };

        optionsDiv.appendChild(button);

    });
}


/* ANSWER */

function selectAnswer(score) {

    totalScore += score;

    currentQuestion++;

    if (currentQuestion < questions.length) {

        showQuestion();

    } else {

        showResult();

    }
}


/* RESULT */

function showResult() {

    document.getElementById("quiz").classList.add("hidden");
    document.getElementById("result").classList.remove("hidden");

    const percentage = totalScore;

    document.getElementById("resultPercent").textContent =
        percentage + "%";

    let message = "";

    if (percentage <= 20) {

        message =
            userName +
            ", you're probably safe! 😇<br><br>" +
            "The chances of getting blocked are very low.";

    }
    else if (percentage <= 50) {

        message =
            userName +
            ", you're walking on thin ice! 😅<br><br>" +
            "There is a small chance they might block you.";

    }
    else if (percentage <= 80) {

        message =
            userName +
            ", be careful! 👀<br><br>" +
            "Your blocking chances are getting pretty high.";

    }
    else {

        message =
            userName +
            ", RUN! 😂🚫<br><br>" +
            "The block button is probably already open!";

    }

    document.getElementById("resultMessage").innerHTML = message;
}


/* RESTART */

function restartQuiz() {

    currentQuestion = 0;
    totalScore = 0;

    document.getElementById("result").classList.add("hidden");
    document.getElementById("home").classList.remove("hidden");

    document.getElementById("name").value = "";
}


/* SHARE */

function shareResult() {

    const percent = totalScore;

    const text =
        "I got " +
        percent +
        "% on 'Will They Block You?' 😂🚫";

    if (navigator.share) {

        navigator.share({
            title: "Will They Block You?",
            text: text,
            url: window.location.href
        });

    } else {

        navigator.clipboard.writeText(
            text + " " + window.location.href
        );

        alert("Result link copied! 📋");

    }
}

</script>

</body>
</html>
